services:
  db:
    image: postgres:16-alpine
    container_name: gpuswapper-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gpuswapper
      POSTGRES_PASSWORD: gpuswapper_dev_only
      POSTGRES_DB: gpuswapper
    ports:
      # Bound to localhost only. Change the host port if 55480 is taken.
      - "127.0.0.1:55480:5432"
    volumes:
      - gpuswapper-db:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpuswapper -d gpuswapper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gpuswapper-db:
